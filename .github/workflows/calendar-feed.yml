name: calendar-feed

# Mỗi 10 phút tạo file lịch .ics cho từng nhân viên từ Google Sheet 工作日報 và đưa lên
# nhánh `calendar-feed`. Mỗi người một lịch (một màu), iPhone đăng ký từng link:
#   https://raw.githubusercontent.com/<owner>/<repo>/calendar-feed/<slug>.ics

on:
  schedule:
    - cron: '*/10 * * * *' # mỗi 10 phút (chỉ commit khi nội dung đổi)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/sheet-calendar-sync/ics/**
      - .github/workflows/calendar-feed.yml

permissions:
  contents: write

concurrency:
  group: calendar-feed
  cancel-in-progress: false

env:
  SHEET_ID: 1Nzi11B4LTZI5juPNof_8Ak6lxv4axrZB
  FEED_BRANCH: calendar-feed
  # tên ở cột B | tên file | màu gợi ý của lịch
  PEOPLE: |
    春豐|chunfeng|#2563EB
    名翔|mingxiang|#F97316
    曰廣|yueguang|#9333EA
    維院|weiyuan|#DB2777
    文穩|wenwen|#0D9488

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet openpyxl

      - name: Download sheet once
        run: |
          curl -fsSL -o sheet.xlsx "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx"

      - name: Build ICS for each person
        run: |
          set -e
          mkdir -p out
          while IFS='|' read -r NAME SLUG COLOR; do
            [ -z "$NAME" ] && continue
            python tools/sheet-calendar-sync/ics/build_ics.py \
              --src sheet.xlsx \
              --name "$NAME" \
              --past-days 30 --future-days 45 \
              --mark icon \
              --color "$COLOR" \
              --out "out/${SLUG}.ics"
          done <<< "$PEOPLE"
          ls -l out

      - name: Publish to feed branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir feed && cd feed
          git init -q -b "${FEED_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin "${FEED_BRANCH}"; then
            git checkout -q -B "${FEED_BRANCH}" FETCH_HEAD
          fi
          cp ../out/*.ics .
          git add ./*.ics
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
            exit 0
          fi
          git commit -q -m "feed: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin "HEAD:${FEED_BRANCH}"
